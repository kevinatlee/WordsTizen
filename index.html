<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; frame-src https://words.atlee.io; child-src https://words.atlee.io; connect-src https://words.atlee.io wss://words.atlee.io; object-src 'none'; base-uri 'none'; form-action 'none'; block-all-mixed-content">
    <title>Words</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="$WEBAPIS/webapis/webapis.js"></script>
    <script defer src="js/url-policy.js"></script>
    <script defer src="js/viewport.js"></script>
    <script defer src="js/app.js"></script>
</head>
<body tabindex="-1">
    <main id="surface" aria-label="Words TV display"></main>
    <section id="loading" class="overlay" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading Words…</p>
    </section>
    <section id="error" class="overlay" role="alert" hidden>
        <h1>Unable to load Words</h1>
        <p>Check your connection and try again.</p>
        <button id="retry" type="button">Retry</button>
    </section>
</body>
</html>
